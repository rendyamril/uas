    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // --- Sidebar Logic ---
            const menuBtn = document.getElementById('open-menu-btn');
            const closeBtn = document.getElementById('close-btn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');

            if (menuBtn && closeBtn && sidebar && overlay) {
                function toggleSidebar() {
                    sidebar.classList.toggle('open');
                    overlay.classList.toggle('hidden');
                }
                menuBtn.addEventListener('click', toggleSidebar);
                closeBtn.addEventListener('click', toggleSidebar);
                overlay.addEventListener('click', toggleSidebar);
            }
            
            // --- Search Bar Logic ---
            const searchInput = document.getElementById('search-input');
            const suggestionsContainer = document.getElementById('suggestions-container');
            const searchButton = document.querySelector('.search-button');

            if (searchInput && suggestionsContainer && searchButton) {
                const suggestionsData = [
                    { name: 'Geography Now! Indonesia', url: 'https://tugas.unsia.net/uas/videos/video1.html' },
                    { name: 'INDONESIA MAKES US FEEL ALIVE', url: 'https://tugas.unsia.net/uas/videos/video2.html' },
                    { name: 'Luxury Train From Jogjakarta to Surabaya', url: 'https://tugas.unsia.net/uas/videos/video3.html' },
                    { name: 'Hiking Rinjani 3726M', url: 'https://tugas.unsia.net/uas/videos/video4.html' },
                    { name: 'We sailed around KOMODO ISLAND', url: 'https://tugas.unsia.net/uas/videos/video5.html' },
                    { name: 'Mount Rinjani Best Treks in the World', url: 'https://tugas.unsia.net/uas/blog/blog1.html' },
                    { name: 'Komodo Islands Backpacking Guide', url: 'https://tugas.unsia.net/uas/blog/blog2.html' },
                    { name: 'Bali Travel Guide for First-Timers', url: 'https://tugas.unsia.net/uas/blog/blog3.html' },
                    { name: 'Mount Bromo: A Day Trip to see a Volcano in Indonesia', url: 'https://tugas.unsia.net/uas/blog/blog4.html' },
                    { name: 'Things to see and do in Jakarta', url: 'https://tugas.unsia.net/uas/blog/blog5.html' },
                ];

                let activeSuggestionIndex = -1;

                function showSuggestions(input) {
                    suggestionsContainer.innerHTML = '';
                    if (input.length === 0) {
                        suggestionsContainer.classList.add('hidden');
                        return;
                    }

                    const filteredSuggestions = suggestionsData.filter(item =>
                        item.name.toLowerCase().includes(input.toLowerCase())
                    );

                    if (filteredSuggestions.length > 0) {
                        filteredSuggestions.forEach((item) => {
                            const div = document.createElement('div');
                            div.textContent = item.name;
                            div.classList.add('suggestion-item');
                            div.addEventListener('click', () => {
                                window.location.href = item.url;
                            });
                            suggestionsContainer.appendChild(div);
                        });
                        suggestionsContainer.classList.remove('hidden');
                    } else {
                        suggestionsContainer.classList.add('hidden');
                    }
                    activeSuggestionIndex = -1; 
                }
                
                document.addEventListener('click', function(event) {
                    if (!event.target.closest('.header-center')) {
                        suggestionsContainer.classList.add('hidden');
                    }
                });

                searchInput.addEventListener('input', () => showSuggestions(searchInput.value));
                
                searchInput.addEventListener('focus', () => {
                    if (searchInput.value.length > 0) {
                        showSuggestions(searchInput.value);
                    }
                });

                searchButton.addEventListener('click', () => {
                    const items = suggestionsContainer.querySelectorAll('.suggestion-item');
                    if (activeSuggestionIndex > -1 && items[activeSuggestionIndex]) {
                        const selectedSuggestion = suggestionsData.find(item => item.name === items[activeSuggestionIndex].textContent);
                        if(selectedSuggestion) window.location.href = selectedSuggestion.url;
                    } else if (searchInput.value) {
                         console.log(`Searching for: ${searchInput.value}`);
                    }
                });

                searchInput.addEventListener('keydown', (e) => {
                    const items = suggestionsContainer.querySelectorAll('.suggestion-item');
                    if (items.length === 0) return;

                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        activeSuggestionIndex = (activeSuggestionIndex + 1) % items.length;
                        updateActiveSuggestion(items);
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        activeSuggestionIndex = (activeSuggestionIndex - 1 + items.length) % items.length;
                        updateActiveSuggestion(items);
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        if (activeSuggestionIndex > -1) {
                            items[activeSuggestionIndex].click();
                        } else if (searchInput.value) {
                            console.log(`Searching for: ${searchInput.value}`);
                        }
                    }
                });

                function updateActiveSuggestion(items) {
                    items.forEach(item => item.classList.remove('active'));
                    if (items[activeSuggestionIndex]) {
                        items[activeSuggestionIndex].classList.add('active');
                    }
                }
            }

            // --- Contact Form Logic ---
            const contactForm = document.getElementById('contact-form');
            if(contactForm) {
                const submitBtn = contactForm.querySelector('.submit-btn');
                const btnText = submitBtn.querySelector('.btn-text');

                contactForm.addEventListener('submit', function (e) {
                    e.preventDefault();
                    const form = e.target;
                    const data = new FormData(form);

                    btnText.textContent = 'Sending...';
                    submitBtn.disabled = true;

                    fetch(form.action, {
                        method: form.method,
                        body: data,
                        headers: {
                            'Accept': 'application/json'
                        }
                    }).then(response => {
                        if (response.ok) {
                            btnText.textContent = 'Message Sent';
                            submitBtn.classList.add('sent');
                            form.reset();
                        } else {
                            response.json().then(data => {
                                if (Object.hasOwn(data, 'errors')) {
                                    alert(data["errors"].map(error => error["message"]).join(", "));
                                } else {
                                    alert('Oops! There was a problem submitting your form');
                                }
                            })
                            btnText.textContent = 'Send Message';
                        }
                    }).catch(error => {
                        alert('Oops! There was a problem submitting your form');
                        btnText.textContent = 'Send Message';
                    }).finally(() => {
                        setTimeout(() => {
                            submitBtn.classList.remove('sent');
                            btnText.textContent = 'Send Message';
                            submitBtn.disabled = false;
                        }, 3000);
                    });
                });
            }
        });
    </script>
